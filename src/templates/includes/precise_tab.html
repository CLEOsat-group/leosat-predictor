<fieldset>
    <legend>Precise Prediction Settings</legend>
    <div class="form-group">
        <label for="interval">Interval:</label>
        <div class="inline-container-interval">
            <input type="text" id="interval" value="5" />
            <select id="interval_unit">
                <option value="seconds">Seconds</option>
                <option value="minutes">Minutes</option>
                <option value="hours">Hours</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="prediction_range_precise">Time of Day:</label>
        <select id="prediction_range_precise">
            <option value="morning">Morning</option>
            <option value="evening">Evening</option>
            <option value="both" selected>Both</option>
        </select>
    </div>
    <hr>
    <h4>Visibility Constraints</h4>
    <div class="form-group">
        <label for="lowestElevation">Lowest Elevation (°):</label>
        <input type="text" id="lowestElevation" value="30" />
    </div>

    <div class="form-group">
        <label for="sunZenithHighest">Sun Zenith Angle (Highest °):</label>
        <input type="text" id="sunZenithHighest" value="112" />
    </div>

    <div class="form-group">
        <label for="sunZenithLowest">Sun Zenith Angle (Lowest °):</label>
        <input type="text" id="sunZenithLowest" value="99" />
    </div>
</fieldset>
