<!-- src/templates/map_popup.html -->
<div id="mapOverlay" class="overlay hidden"></div>
<div id="mapPopup" class="map-popup hidden">
    <div class="map-header">
        <h2>Select Observation Location</h2>
    </div>
    <div class="map-container">
        <div id="map"></div>
    </div>
    <div class="map-popup-buttons">
        <button id="confirmMapSelectionBtn">Confirm Selection</button>
        <button id="saveLocationFromMapBtn">Save to Database</button>
        <button id="clearMapLocationMarkerBtn">Clear Location</button>
        <button id="closeMapPopupBtn">Close</button>
    </div>
</div>
